name: Build browser extension

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "public/**"
      - "extension/**"
      - "scripts/**"
      - "tests/unit/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extension-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test comparison and validation logic
        run: npm test
      - name: Build extension
        run: npm run build:extension
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: instagram-follow-checker-extension
          path: dist-extension/
          if-no-files-found: error
          retention-days: 30
